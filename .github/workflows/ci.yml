name: Clojure CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    strategy:
      matrix:
        jdk: [ 11, 17, 21, 25 ]     # Support every Java LTS up through current
        clojure: [ 11 ]

    name: Clojure ${{ matrix.clojure }} Java ${{ matrix.jdk }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # so build.clj's git-count-revs reports the real rev-count
      - name: Setup Java ${{ matrix.jdk }}
        uses: actions/setup-java@v3.12.0
        with:
          distribution: zulu
          java-version: ${{ matrix.jdk }}
      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@master
        with:
          cli: latest
      - name: Cache clojure dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: cljdeps-${{ hashFiles('deps.edn', 'build.clj') }}
          restore-keys: cljdeps-
      - name: Execute tests
        run: clojure -M:test
      - name: Build uberjar
        run: clojure -T:build uber
